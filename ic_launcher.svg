  <!-- 音符杆 -->
  <rect x="54" y="28" width="5" height="42" rx="2" fill="#FFFFFF"/>
  <!-- 音符旗 -->
  <path d="M59 28 Q76 30 76 44 Q76 38 65 35 Z" fill="#FFFFFF"/>

